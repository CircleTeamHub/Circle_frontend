appId: ${APP_ID}
name: WindNote profile and settings restoration
tags:
  - profile
  - mutation
---
- runFlow:
    file: ../subflows/launch.yaml
- runFlow:
    file: ../subflows/ensure-signed-in.yaml
- tapOn:
    id: windnote.tabs.profile
- tapOn:
    id: windnote.profile.settings
# 昵称在「个人资料」页里用底部弹层编辑（旧的 settings.row.profile-nickname 与独立编辑页已不在设置入口上）。
- tapOn:
    id: windnote.settings.row.profile
- tapOn:
    id: windnote.profile-field.row.nickname
- extendedWaitUntil:
    visible:
      id: windnote.profile-field.sheet
    timeout: 30000
- tapOn:
    id: windnote.profile-field.input
- eraseText: 100
- inputText: WINDNOTE-${E2E_RUN_ID}
- hideKeyboard
- tapOn:
    id: windnote.profile-field.save
- assertVisible: WINDNOTE-${E2E_RUN_ID}
- tapOn:
    id: windnote.profile-field.row.nickname
- extendedWaitUntil:
    visible:
      id: windnote.profile-field.sheet
    timeout: 30000
- tapOn:
    id: windnote.profile-field.input
- eraseText: 100
- inputText: ${E2E_ORIGINAL_NICKNAME}
- hideKeyboard
- tapOn:
    id: windnote.profile-field.save
- assertVisible: ${E2E_ORIGINAL_NICKNAME}
- back
- extendedWaitUntil:
    visible:
      id: windnote.settings.screen
    timeout: 30000
- tapOn:
    id: windnote.settings.row.notifications
- extendedWaitUntil:
    visible:
      id: windnote.settings-detail.screen.notifications
    timeout: 30000
- tapOn:
    id: windnote.settings-detail.row.notifications.push
- tapOn:
    id: windnote.settings-detail.row.notifications.push
- back
- tapOn:
    id: windnote.settings.row.privacy
- extendedWaitUntil:
    visible:
      id: windnote.settings-detail.screen.privacy
    timeout: 30000
- tapOn:
    id: windnote.settings-detail.row.privacy.stranger-message
- tapOn:
    id: windnote.settings-detail.row.privacy.stranger-message
- takeScreenshot: windnote-profile-settings-${E2E_RUN_ID}
