appId: ${APP_ID}
name: WindNote friend and circle navigation
tags:
  - social
  - readonly
---
- runFlow:
    file: ../subflows/launch.yaml
- runFlow:
    file: ../subflows/ensure-signed-in.yaml
- tapOn:
    id: windnote.tabs.contacts
- tapOn:
    id: windnote.contacts.add-friend
- extendedWaitUntil:
    visible:
      id: windnote.friend-search.screen
    timeout: 30000
- tapOn:
    id: windnote.friend-search.input
- inputText: ${E2E_FRIEND_ACCOUNT}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: windnote.friend-search.result.${E2E_FRIEND_ID}
    timeout: 30000
- tapOn:
    id: windnote.friend-search.result.${E2E_FRIEND_ID}
- assertVisible:
    id: windnote.user-profile.screen
- tapOn:
    id: windnote.tabs.discover
# 动态 tab 的根屏就是圈子广场，不再有中间的入口列表要点。
- extendedWaitUntil:
    visible:
      id: windnote.circle-plaza.screen
    timeout: 30000
# 「发现圈子」的入口（广场右上角搜索键）已按要求移除，App 内不再有任何路径
# 能走到圈子搜索 → 圈子详情 → 群聊。这段流程原本覆盖那条链路，现在够不着了，
# 只能一并摘掉。等发现圈子重新有入口，把这段按新入口接回来。
- takeScreenshot: windnote-social-circle
