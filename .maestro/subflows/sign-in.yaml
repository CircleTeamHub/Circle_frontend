appId: ${APP_ID}
---
- assertVisible:
    id: windnote.auth.login.screen
- tapOn:
    id: windnote.auth.login.email-input
- eraseText: 100
- inputText: ${E2E_EMAIL}
- tapOn:
    id: windnote.auth.login.password-input
- inputText: ${MAESTRO_E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: windnote.auth.login.submit
- extendedWaitUntil:
    visible:
      id: windnote.tabs.messages
    timeout: 60000
