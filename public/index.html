<!DOCTYPE html>
<!--
  Web 外壳。app.json 的 web.output 是 "single"（单页应用），这种模式下
  Expo 只认这份 public/index.html（dev 与 export 共用），app/+html.tsx
  不会被读取 —— 以前写在那里的样式线上一条都没生效过。
-->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <!--
      maximum-scale=1：iOS Safari 聚焦字号 < 16px 的输入框会自动放大页面，
      打完字也不缩回，只能手动捏回去。加了它 iOS 不再自动放大，用户双指缩放
      照常可用（iOS 10 起 Safari 对手势忽略缩放上限）。
      不要写 user-scalable=no：那会把主动缩放也一起禁掉。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <!--
      添加到主屏幕用的信息直接写在外壳里：要是等主包跑完再由 JS 注入，页面停在恢复页
      或还没加载完时添加，桌面图标会退成一个字母。
      apple-mobile-web-app-capable 不能省：没有它 iOS 添加时不会去取下面的启动图
      （iOS 27.2 模拟器实测）；mobile-web-app-capable 是它的新名字，Chrome 只认这个。
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/windnote-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      从桌面打开、页面还没下载到之前，iOS 只能画启动图，没有就是整屏纯色（深色模式全黑）。
      每种屏幕、浅色深色各一张，和下面的 #boot-splash 同底色同位置。
      由 scripts/generate-web-startup-images.mjs 生成，别手改。
    -->
    <!-- web-startup-images:start -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" href="/startup/iphone-375x667@2x-light.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/startup/iphone-375x667@2x-dark.png" />

    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" href="/startup/iphone-414x896@2x-light.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/startup/iphone-414x896@2x-dark.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/startup/iphone-414x896@3x-light.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/startup/iphone-414x896@3x-dark.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/startup/iphone-390x844@3x-light.png" />

    <!-- web-startup-images:end -->
    <style id="expo-reset">
      /* react-native-web 推荐的根元素重置：全高、根节点 flex。 */
      html,
      body,
      #root {
        height: 100%;
      }
      #root {
        display: flex;
        flex: 1;
      }
      /* 把文档级滚动锁死：App 是固定视口应用，滚动只应发生在内部
         ScrollView/FlatList；文档本身能滚，输入框聚焦等触发就可能把整页
         滚到错误位置。overscroll-behavior 关掉整页回弹和下拉刷新。 */
      html {
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        overflow: hidden;
      }
      /* 文字输入去掉浏览器默认的焦点框：RNW 的 TextInput 渲染成
         <input>/<textarea>，聚焦时浏览器会在我们自绘的圆角边框里再套一圈
         方框（iOS Safari 上是一圈蓝框）。这几类元素有光标指示焦点，
         按钮/链接的焦点环保留，键盘导航看得见落点。

         为什么不留 :focus-visible —— 规范规定「接受键盘文本输入的元素」
         始终匹配 :focus-visible，点击也算，留着等于把那圈框原样放回来。 */
      input:focus,
      input:focus-visible,
      textarea:focus,
      textarea:focus-visible,
      [contenteditable]:focus,
      [contenteditable]:focus-visible {
        outline: none;
        box-shadow: none;
      }
      /* select 是例外，必须留焦点指示：它没有光标，摘掉之后键盘用户 tab
         进来完全看不出焦点落在哪一个下拉上。默认亮环换成跟随主题文本色的
         描边 —— 不扎眼，也不会丢失落点。 */
      select:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 1px;
      }

      /* 页面底色跟主题：iOS 的状态栏和 Safari 工具栏按页面底色取色，留白的话深色模式下
         顶上一条是白的。这里只能按系统深浅色给初值，App 里手动选的主题由
         src/theme/provider.tsx 挂载后改写。取 src/theme/colors.ts 的 background。 */
      html,
      body,
      #boot-splash {
        background-color: #F8F9FA;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #boot-splash {
          background-color: #000000;
        }
      }

      /* 启动画面：主包下载、执行完之前唯一能画出来的东西。
         添加到主屏幕的网页 App 有自己独立的数据区，首次打开要重新下载
         约 3MB（压缩后）的主包；WebKit 在脚本还在下载、页面又「看起来是空的」时
         不提交首帧，深色模式下整屏是黑的。图片要大于 32×32 才算非空。
         它放在 #root 里，React 首次提交时会清空 #root，不用手动移除。
         主包下载失败 / 一分钟没出页面由 scripts/web-startup.cjs 的诊断面板接手。
         改了布局（图标大小、间距）要重新生成启动图，它们按同一个位置画图标。
         转圈取 src/theme/colors.ts 的 primary。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }
      /* 图标是不透明的方块，桌面上的圆角是 iOS 自己加的遮罩；这里照着切，
         看起来就是刚点的那个桌面图标。 */
      #boot-splash img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      .boot-spinner {
        width: 24px;
        height: 24px;
        box-sizing: border-box;
        border: 3px solid rgba(99, 102, 241, 0.25);
        border-top-color: #6366F1;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="boot-splash">
        <img src="/icons/windnote-192.png" width="96" height="96" alt="" />
        <div class="boot-spinner"></div>
      </div>
    </div>
  </body>
</html>
