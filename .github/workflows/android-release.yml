name: Publish Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.2.0"
        required: true
        type: string

concurrency:
  group: android-release-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_REPOSITORY: CircleTeamHub/windnote-releases

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application checks
        run: npm run ci

      - name: Validate release metadata and ancestry
        id: release
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_OPENIM_API_URL: ${{ vars.EXPO_PUBLIC_OPENIM_API_URL }}
          EXPO_PUBLIC_OPENIM_WS_URL: ${{ vars.EXPO_PUBLIC_OPENIM_WS_URL }}
        run: |
          set -euo pipefail
          node .github/scripts/validate-android-release.js metadata
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git merge-base --is-ancestor HEAD origin/main
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$tag_commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build signed APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false

      - name: Validate signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: node .github/scripts/validate-android-release.js signing

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/android-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/windnote-release.jks"
          chmod 600 "$signing_dir/windnote-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$signing_dir/windnote-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_OPENIM_API_URL: ${{ vars.EXPO_PUBLIC_OPENIM_API_URL }}
          EXPO_PUBLIC_OPENIM_WS_URL: ${{ vars.EXPO_PUBLIC_OPENIM_WS_URL }}
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify and stage APK
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk_source="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_source"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          cert_output="$("$apksigner_path" verify --verbose --print-certs "$apk_source")"
          actual_cert="$(printf '%s\n' "$cert_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::APK signer certificate does not match ANDROID_CERT_SHA256"
            exit 1
          fi
          cp "$apk_source" "$RUNNER_TEMP/windnote.apk"
          (cd "$RUNNER_TEMP" && sha256sum windnote.apk > windnote.apk.sha256)

      - name: Upload private release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: android-release-apk
          path: |
            ${{ runner.temp }}/windnote.apk
            ${{ runner.temp }}/windnote.apk.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Promote APK to public release
    needs: [preflight, build]
    if: ${{ vars.ANDROID_PUBLIC_RELEASE_ENABLED == 'true' }}
    environment: android-release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false

      - name: Download private release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.8
        with:
          name: android-release-apk
          path: ${{ runner.temp }}/android-release

      - name: Verify artifact checksum
        working-directory: ${{ runner.temp }}/android-release
        run: sha256sum -c windnote.apk.sha256

      - name: Validate distribution approval
        env:
          ANDROID_PUBLIC_RELEASE_ENABLED: ${{ vars.ANDROID_PUBLIC_RELEASE_ENABLED }}
          ANDROID_DISTRIBUTION_APPROVED: ${{ vars.ANDROID_DISTRIBUTION_APPROVED }}
          ANDROID_DISTRIBUTION_EVIDENCE_URL: ${{ vars.ANDROID_DISTRIBUTION_EVIDENCE_URL }}
        run: node .github/scripts/validate-android-release.js distribution

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_REPOSITORY: CircleTeamHub/windnote-releases
          APK_PATH: ${{ runner.temp }}/android-release/windnote.apk
        run: node .github/scripts/publish-android-release.js

  notify:
    name: Report release result
    needs: [preflight, build, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          ACTIONS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: https://github.com/CircleTeamHub/windnote-releases/releases/tag/${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification"
            exit 0
          fi
          payload="$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg preflight "$PREFLIGHT_RESULT" \
            --arg build "$BUILD_RESULT" \
            --arg publish "$PUBLISH_RESULT" \
            --arg actions "$ACTIONS_URL" \
            --arg release "$RELEASE_URL" \
            '{content: ("Android release " + $tag + " — preflight: " + $preflight + ", build: " + $build + ", publish: " + $publish + "\nActions: " + $actions + "\nRelease: " + $release)}')"
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
