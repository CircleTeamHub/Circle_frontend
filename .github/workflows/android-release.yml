name: Publish Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.2.0"
        required: true
        type: string

concurrency:
  group: android-release-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_REPOSITORY: CircleTeamHub/windnote-releases

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Validate release metadata and ancestry
        id: release
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_OPENIM_API_URL: ${{ vars.EXPO_PUBLIC_OPENIM_API_URL }}
          EXPO_PUBLIC_OPENIM_WS_URL: ${{ vars.EXPO_PUBLIC_OPENIM_WS_URL }}
          EXPO_PUBLIC_MEMBERSHIP_SUPPORT_USER_ID: ${{ vars.EXPO_PUBLIC_MEMBERSHIP_SUPPORT_USER_ID }}
          # 客服账号兜底变量必须和 build 步一致地转发进来 —— GitHub repository variables 不会自动
          # 进 process.env,不转发的话 validateSupportAccounts 会看到五个全空、每次打 tag 都在
          # 测试/构建之前就 fail,即便仓库其实配好了。
          EXPO_PUBLIC_SUPPORT_ACCOUNT_ID: ${{ vars.EXPO_PUBLIC_SUPPORT_ACCOUNT_ID }}
          EXPO_PUBLIC_SUPPORT_RECHARGE_ID: ${{ vars.EXPO_PUBLIC_SUPPORT_RECHARGE_ID }}
          EXPO_PUBLIC_SUPPORT_ISSUE_ID: ${{ vars.EXPO_PUBLIC_SUPPORT_ISSUE_ID }}
          EXPO_PUBLIC_SUPPORT_DISPUTE_ID: ${{ vars.EXPO_PUBLIC_SUPPORT_DISPUTE_ID }}
          EXPO_PUBLIC_SUPPORT_ACCOUNT_AGENT_ID: ${{ vars.EXPO_PUBLIC_SUPPORT_ACCOUNT_AGENT_ID }}
        run: |
          set -euo pipefail
          node .github/scripts/validate-android-release.js metadata
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git merge-base --is-ancestor HEAD origin/main
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run application checks
        run: npm run ci

  build:
    name: Build signed APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Validate signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: node .github/scripts/validate-android-release.js signing

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/android-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/windnote-release.jks"
          chmod 600 "$signing_dir/windnote-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$signing_dir/windnote-release.jks" >> "$GITHUB_ENV"

      - name: Verify restored signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          key_output="$(keytool -list -v -J-Duser.language=en \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS")"
          actual_cert="$(printf '%s\n' "$key_output" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([[:xdigit:]:]+)[[:space:]]*$/\1/p' | head -n 1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::Restored signing key certificate does not match ANDROID_CERT_SHA256. Actual: $actual_cert Expected: $expected_cert"
            exit 1
          fi
          echo "Restored signing key certificate SHA-256: $actual_cert"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_OPENIM_API_URL: ${{ vars.EXPO_PUBLIC_OPENIM_API_URL }}
          EXPO_PUBLIC_OPENIM_WS_URL: ${{ vars.EXPO_PUBLIC_OPENIM_WS_URL }}
          EXPO_PUBLIC_MEMBERSHIP_SUPPORT_USER_ID: ${{ vars.EXPO_PUBLIC_MEMBERSHIP_SUPPORT_USER_ID }}
          # 客服中心各入口的专属账号：不注入则 support-categories.ts 编译期回落到 imAdmin，
          # 生产用户点「充值/纠纷/账号客服」会被导去系统管理员会话而非对应真人客服。
          EXPO_PUBLIC_SUPPORT_ACCOUNT_ID: ${{ vars.EXPO_PUBLIC_SUPPORT_ACCOUNT_ID }}
          EXPO_PUBLIC_SUPPORT_RECHARGE_ID: ${{ vars.EXPO_PUBLIC_SUPPORT_RECHARGE_ID }}
          EXPO_PUBLIC_SUPPORT_ISSUE_ID: ${{ vars.EXPO_PUBLIC_SUPPORT_ISSUE_ID }}
          EXPO_PUBLIC_SUPPORT_DISPUTE_ID: ${{ vars.EXPO_PUBLIC_SUPPORT_DISPUTE_ID }}
          EXPO_PUBLIC_SUPPORT_ACCOUNT_AGENT_ID: ${{ vars.EXPO_PUBLIC_SUPPORT_ACCOUNT_AGENT_ID }}
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify and stage APK
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk_source="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_source"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          cert_output="$("$apksigner_path" verify --verbose --print-certs "$apk_source")"
          printf '%s\n' "$cert_output"
          actual_cert="$(printf '%s\n' "$cert_output" | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+)[[:space:]]*$/\1/p' | head -n 1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::APK signer certificate does not match ANDROID_CERT_SHA256. Actual: $actual_cert Expected: $expected_cert"
            exit 1
          fi
          cp "$apk_source" "$RUNNER_TEMP/windnote.apk"
          (cd "$RUNNER_TEMP" && sha256sum windnote.apk > windnote.apk.sha256)

      - name: Upload private release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-apk
          path: |
            ${{ runner.temp }}/windnote.apk
            ${{ runner.temp }}/windnote.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Promote APK to public release
    needs: [preflight, build]
    # 默认关死的发布门禁（#84；docs/android-release.md 描述的 fail-closed 契约）：
    # 只有仓库变量 ANDROID_PUBLIC_RELEASE_ENABLED 显式设为 'true' 时才把 APK
    # 提升为公开 GitHub release + R2 公网桶。默认（变量缺失/false）v* tag 推送
    # 只产出私有 Actions artifact。在 AGPL 分发问题（#95）有结论前保持关闭。
    if: ${{ vars.ANDROID_PUBLIC_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # review 修复：分发证据门禁在公开发布前强制执行 —— 只靠
      # ANDROID_PUBLIC_RELEASE_ENABLED 一个变量时，单次误设即可在没有任何
      # 自动化证据校验的情况下把公网 APK 发出去。APPROVED/EVIDENCE_URL 从
      # 仓库变量注入，校验逻辑与文档同源（validate-android-release.js）。
      - name: Enforce distribution evidence gate
        env:
          # round 2 review：校验器同时要求 ANDROID_PUBLIC_RELEASE_ENABLED
          # === 'true'，而 GitHub 的 vars 上下文不会自动注入 runner 环境 ——
          # 不传的话即使正当启用发布，门禁也会在下载产物前误拦。
          ANDROID_PUBLIC_RELEASE_ENABLED: ${{ vars.ANDROID_PUBLIC_RELEASE_ENABLED }}
          ANDROID_DISTRIBUTION_APPROVED: ${{ vars.ANDROID_DISTRIBUTION_APPROVED }}
          ANDROID_DISTRIBUTION_EVIDENCE_URL: ${{ vars.ANDROID_DISTRIBUTION_EVIDENCE_URL }}
        run: node .github/scripts/validate-android-release.js distribution

      - name: Download private release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-apk
          path: ${{ runner.temp }}/android-release

      - name: Verify artifact checksum
        working-directory: ${{ runner.temp }}/android-release
        run: sha256sum -c windnote.apk.sha256

      - name: Publish public GitHub release
        id: publish_release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_REPOSITORY: CircleTeamHub/windnote-releases
          APK_PATH: ${{ runner.temp }}/android-release/windnote.apk
        run: node .github/scripts/publish-android-release.js

      - name: Upload versioned APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: windnote-apk-releases
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          APK_PATH: ${{ runner.temp }}/android-release/windnote.apk
          CHECKSUM_PATH: ${{ runner.temp }}/android-release/windnote.apk.sha256
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          object_key="android/releases/${RELEASE_TAG}/windnote.apk"
          apk_sha="$(awk '{print $1}' "$CHECKSUM_PATH")"
          apk_size="$(wc -c < "$APK_PATH" | tr -d '[:space:]')"
          aws s3api put-object \
            --endpoint-url "$endpoint" \
            --bucket "$R2_BUCKET" \
            --key "$object_key" \
            --body "$APK_PATH" \
            --content-type application/vnd.android.package-archive \
            --content-disposition "attachment; filename=\"windnote-${RELEASE_TAG}.apk\"" \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata "sha256=$apk_sha" \
            >/dev/null
          read -r uploaded_size uploaded_sha <<< "$(aws s3api head-object \
            --endpoint-url "$endpoint" \
            --bucket "$R2_BUCKET" \
            --key "$object_key" \
            --query '[ContentLength, Metadata.sha256]' \
            --output text)"
          test "$uploaded_size" = "$apk_size"
          test "$uploaded_sha" = "$apk_sha"

      - name: Promote APK to Cloudflare R2 latest
        if: ${{ steps.publish_release.outputs.promote_latest == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: windnote-apk-releases
          R2_PUBLIC_APK_URL: https://pub-9d36120697ca455b9fb0e430da8b9481.r2.dev/android/latest/windnote.apk
          APK_PATH: ${{ runner.temp }}/android-release/windnote.apk
          CHECKSUM_PATH: ${{ runner.temp }}/android-release/windnote.apk.sha256
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          object_key="android/latest/windnote.apk"
          apk_sha="$(awk '{print $1}' "$CHECKSUM_PATH")"
          apk_size="$(wc -c < "$APK_PATH" | tr -d '[:space:]')"
          aws s3api put-object \
            --endpoint-url "$endpoint" \
            --bucket "$R2_BUCKET" \
            --key "$object_key" \
            --body "$APK_PATH" \
            --content-type application/vnd.android.package-archive \
            --content-disposition 'attachment; filename="windnote.apk"' \
            --cache-control "public, max-age=300" \
            --metadata "sha256=$apk_sha" \
            >/dev/null
          read -r uploaded_size uploaded_sha <<< "$(aws s3api head-object \
            --endpoint-url "$endpoint" \
            --bucket "$R2_BUCKET" \
            --key "$object_key" \
            --query '[ContentLength, Metadata.sha256]' \
            --output text)"
          test "$uploaded_size" = "$apk_size"
          test "$uploaded_sha" = "$apk_sha"
          curl --fail --silent --show-error --head --retry 5 --retry-all-errors \
            "$R2_PUBLIC_APK_URL" > "$RUNNER_TEMP/r2-latest-headers.txt"
          grep -qi '^content-type: application/vnd.android.package-archive' \
            "$RUNNER_TEMP/r2-latest-headers.txt"

  notify:
    name: Report release result
    needs: [preflight, build, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          ACTIONS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: https://github.com/CircleTeamHub/windnote-releases/releases/tag/${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification"
            exit 0
          fi
          payload="$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg preflight "$PREFLIGHT_RESULT" \
            --arg build "$BUILD_RESULT" \
            --arg publish "$PUBLISH_RESULT" \
            --arg actions "$ACTIONS_URL" \
            --arg release "$RELEASE_URL" \
            '{content: ("Android release " + $tag + " — preflight: " + $preflight + ", build: " + $build + ", publish: " + $publish + "\nActions: " + $actions + "\nRelease: " + $release)}')"
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
