name: Build and publish Android preproduction APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preprod
  cancel-in-progress: false

jobs:
  build:
    name: Build signed private APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Validate preproduction metadata
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CHAT_WS_URL: ${{ vars.EXPO_PUBLIC_CHAT_WS_URL }}
          EXPO_PUBLIC_MEDIA_ORIGINS: ${{ vars.EXPO_PUBLIC_MEDIA_ORIGINS }}
        run: |
          set -euo pipefail
          node .github/scripts/verify-android-preprod.js metadata
          node .github/scripts/validate-android-release.js build-env

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency evidence
        run: npm run licenses:check

      - name: Run application checks
        run: npm run ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore and verify signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          node .github/scripts/validate-android-release.js signing
          signing_dir="$RUNNER_TEMP/android-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/windnote-release.jks"
          chmod 600 "$signing_dir/windnote-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$signing_dir/windnote-release.jks" >> "$GITHUB_ENV"
          key_output="$(keytool -list -v -J-Duser.language=en \
            -keystore "$signing_dir/windnote-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS")"
          actual_cert="$(printf '%s\n' "$key_output" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([[:xdigit:]:]+)[[:space:]]*$/\1/p' | head -n 1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::Signing certificate mismatch. Actual: $actual_cert Expected: $expected_cert"
            exit 1
          fi

      - name: Build signed preproduction APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_CHAT_WS_URL: ${{ vars.EXPO_PUBLIC_CHAT_WS_URL }}
          EXPO_PUBLIC_MEDIA_ORIGINS: ${{ vars.EXPO_PUBLIC_MEDIA_ORIGINS }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify and stage preproduction APK
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk_source="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_source"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          test -n "$aapt_path"
          cert_output="$("$apksigner_path" verify --verbose --print-certs "$apk_source")"
          actual_cert="$(printf '%s\n' "$cert_output" | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+)[[:space:]]*$/\1/p' | head -n 1 | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          expected_cert="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::APK signer certificate mismatch. Actual: $actual_cert Expected: $expected_cert"
            exit 1
          fi
          badging="$("$aapt_path" dump badging "$apk_source" | head -n 1)"
          grep -Fq "package: name='com.yiboding.circleim'" <<< "$badging"
          grep -Fq "versionCode='1000001'" <<< "$badging"
          grep -Fq "versionName='1.0.1'" <<< "$badging"
          node .github/scripts/verify-android-preprod.js apk "$apk_source"
          artifact_dir="$RUNNER_TEMP/android-preprod-v1.0.1"
          mkdir -p "$artifact_dir"
          cp "$apk_source" "$artifact_dir/windnote-preprod-v1.0.1.apk"
          cp assets/legal/THIRD_PARTY_NOTICES.txt "$artifact_dir/"
          cp assets/legal/cyclonedx-sbom.json "$artifact_dir/"
          (cd "$artifact_dir" && sha256sum windnote-preprod-v1.0.1.apk > windnote-preprod-v1.0.1.apk.sha256)

      - name: Upload private preproduction artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-preprod-v1.0.1
          path: ${{ runner.temp }}/android-preprod-v1.0.1/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/android-signing"

  publish:
    name: Publish verified APK to preproduction download
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified preproduction artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-preprod-v1.0.1
          path: ${{ runner.temp }}/android-preprod

      - name: Verify downloaded artifact checksum
        working-directory: ${{ runner.temp }}/android-preprod
        run: sha256sum -c windnote-preprod-v1.0.1.apk.sha256

      - name: Install verified Tencent COSCLI
        run: |
          set -euo pipefail
          coscli_path="$RUNNER_TEMP/coscli-v1.0.8"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output "$coscli_path" \
            "https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64"
          printf '%s  %s\n' \
            '7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91' \
            "$coscli_path" | sha256sum -c -
          chmod 700 "$coscli_path"
          "$coscli_path" --version | grep -Fx 'coscli version v1.0.8'

      - name: Publish verified preproduction APK to Tencent COS
        working-directory: ${{ runner.temp }}/android-preprod
        env:
          COSCLI_PATH: ${{ runner.temp }}/coscli-v1.0.8
          COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          COS_BUCKET: windnote-preprod-tokyo-1447743949
          COS_ENDPOINT: cos.ap-tokyo.myqcloud.com
          COS_KEY_PREFIX: android/preprod
          COS_PUBLIC_APK_URL: https://windnote-preprod-tokyo-1447743949.cos.ap-tokyo.myqcloud.com/android/preprod/latest/windnote.apk
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-android-preprod-cos.sh" \
            "windnote-preprod-v1.0.1.apk" \
            "windnote-preprod-v1.0.1.apk.sha256"
