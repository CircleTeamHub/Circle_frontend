# AI code review — Claude reads each PR diff and comments on bugs, security, and
# logic issues a pattern scanner can't catch.
#
# SETUP (one-time): add an Anthropic API key as a repo secret named
# ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions). Until then the
# review step is skipped (the job still passes — no red X). Billed per run by
# token usage on your Anthropic account.

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    name: "Claude PR review"
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Detect API key
        id: key
        run: echo "present=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude review
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this Expo / React Native (TypeScript, expo-router) PR.
            Prioritise real defects over style. Focus on:
            1. Bugs & logic errors — wrong conditions, unhandled async/await,
               stale closures, missing deps in hooks, race conditions.
            2. React Native pitfalls — re-render / performance issues, effect
               cleanup, navigation state, list keys, platform-specific bugs.
            3. State & data — incorrect store/query updates, optimistic-update
               rollback, error/loading handling on API calls.
            4. Security — leaking tokens/PII, unsafe deep links, missing input
               checks, storing secrets insecurely.
            5. Tests — meaningful coverage for the new behaviour.

            Leave inline comments on specific lines; use a top-level comment for
            the summary. Be concrete and skip nitpicks.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
