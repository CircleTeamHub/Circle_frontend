name: Frontend CI

on:
  pull_request:
    branches:
      - main
    # Docs-only changes can't break the build — skip the whole matrix.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL \
            -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint Workflows
        run: actionlint

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # Single install → every Node check. Previously typecheck / expo-config / lint /
  # test / web-export / security-audit / expo-doctor were 7 separate jobs that
  # each ran `npm ci` (7 redundant installs per run). Consolidating trades a bit
  # of parallel wall-clock for ~6 fewer dependency installs. Fast gates run first
  # so a cheap failure short-circuits before the slow web export; the two
  # advisory reports are continue-on-error and never fail the job.
  verify:
    name: Verify (typecheck, lint, test, web export)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Expo Config Smoke
        run: npm run expo:config

      - name: Test
        run: npm test

      - name: Web Export
        run: npx expo export --platform web

      # babel.config.js 只在 production 构建挂 transform-remove-console，而
      # api.env('production') 没解析到是「静默失效」——strip 哪天不生效，没有人会知道。
      # 复用上一步 Web Export 已经产出的 dist/（NODE_ENV=production，strip 生效），
      # 不额外付构建成本。
      - name: Assert console.* stripped from release bundle
        run: |
          set -euo pipefail
          bundle_dir=dist/_expo/static/js

          # 先证明真的有 bundle 可查：grep 对着错路径只会安静地「没找到」，
          # 那会把这道闸门变成永久绿灯——比没有检查更糟。
          if [ ! -d "$bundle_dir" ]; then
            echo "::error::$bundle_dir not found — expo export layout changed; this guard would silently pass"
            exit 1
          fi
          bundle_count="$(find "$bundle_dir" -name '*.js' -type f | wc -l | tr -d '[:space:]')"
          if [ "$bundle_count" -eq 0 ]; then
            echo "::error::no JS bundles under $bundle_dir — this guard would silently pass"
            exit 1
          fi

          # 例外：reanimated 会把 worklet 源码序列化成字符串塞进 bundle
          # （_worklet_..._init_data.code）。那里面的 console.warn 是字符串字面量、
          # 不是调用表达式，babel 插件按设计就碰不到，且是 vendor 代码——不是我们的
          # 泄漏面。除它以外，任何一条都算 app 代码泄漏。
          leaks="$(grep -rhoE '.{0,60}console\.(log|warn|info|debug)\(' "$bundle_dir" --include='*.js' | grep -v 'ReanimatedLogLevel' || true)"
          if [ -n "$leaks" ]; then
            echo "::error::console.* survived the production bundle — transform-remove-console did not run"
            printf '%s\n' "$leaks"
            exit 1
          fi

          echo "OK: $bundle_count bundle(s) checked, no app console.* survived"

      - name: Audit Production Dependencies (report)
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit.json
          audit_status=$?

          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const metadata = audit.metadata?.vulnerabilities ?? {};
          const rows = Object.values(audit.vulnerabilities ?? {})
            .sort((a, b) => {
              const rank = { critical: 4, high: 3, moderate: 2, low: 1, info: 0 };
              return (rank[b.severity] ?? 0) - (rank[a.severity] ?? 0);
            })
            .slice(0, 10);

          const lines = [
            '## Production Dependency Audit',
            '',
            '| Severity | Count |',
            '| --- | ---: |',
            `| Critical | ${metadata.critical ?? 0} |`,
            `| High | ${metadata.high ?? 0} |`,
            `| Moderate | ${metadata.moderate ?? 0} |`,
            `| Low | ${metadata.low ?? 0} |`,
            '',
          ];

          if (rows.length > 0) {
            lines.push('| Package | Severity | Direct | Via |');
            lines.push('| --- | --- | --- | --- |');
            for (const row of rows) {
              const via = (row.via ?? [])
                .map((entry) => (typeof entry === 'string' ? entry : entry.name))
                .filter(Boolean)
                .slice(0, 3)
                .join(', ');
              lines.push(
                `| ${row.name} | ${row.severity} | ${row.isDirect ? 'yes' : 'no'} | ${via || 'n/a'} |`,
              );
            }
          } else {
            lines.push('No production dependency vulnerabilities reported.');
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

          exit "$audit_status"

      - name: Expo Health Report
        continue-on-error: true
        run: |
          set +e

          npx --yes expo-doctor 2>&1 | tee expo-doctor.log
          doctor_status=${PIPESTATUS[0]}

          npx expo install --check 2>&1 | tee expo-install-check.log
          install_check_status=${PIPESTATUS[0]}

          {
            echo "## Expo Health Report"
            echo
            echo "| Check | Status |"
            echo "| --- | ---: |"
            echo "| expo-doctor | ${doctor_status} |"
            echo "| expo install --check | ${install_check_status} |"
            echo
            echo "<details><summary>expo-doctor output</summary>"
            echo
            echo '```text'
            cat expo-doctor.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>expo install --check output</summary>"
            echo
            echo '```text'
            cat expo-install-check.log
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - secret-scan
      - verify
    if: ${{ always() && (contains(join(needs.*.result, ','), 'failure') || contains(join(needs.*.result, ','), 'cancelled')) }}
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Send Discord Notification
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE' > payload.json
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failedJobs = Object.entries(needs)
            .filter(([, job]) => ['failure', 'cancelled'].includes(job.result))
            .map(([name, job]) => `${name}: ${job.result}`);

          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const refName = process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME;
          const shortSha = process.env.GITHUB_SHA.slice(0, 7);

          const payload = {
            username: 'GitHub Actions',
            content: [
              `:rotating_light: **Frontend CI ${failedJobs.some((job) => job.endsWith('cancelled')) ? 'cancelled' : 'failed'}**`,
              `**Repository:** ${process.env.GITHUB_REPOSITORY}`,
              `**Ref:** ${refName}`,
              `**Commit:** ${shortSha}`,
              `**Actor:** ${process.env.GITHUB_ACTOR}`,
              `**Jobs:** ${failedJobs.join(', ')}`,
              `**Run:** ${runUrl}`,
            ].join('\n'),
          };

          process.stdout.write(JSON.stringify(payload));
          NODE

          curl --fail-with-body \
            -H 'Content-Type: application/json' \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
